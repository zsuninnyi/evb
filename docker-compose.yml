services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evb
      POSTGRES_PASSWORD: evb
      POSTGRES_DB: evb
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evb -d evb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # minio/minio is no longer published. This image is the public Chainguard MinIO build.
  minio-perms:
    image: mirror.gcr.io/library/busybox:1.37
    user: "0:0"
    volumes:
      - minio-data:/data
    command: ["chown", "-R", "65532:65532", "/data"]
    restart: "no"

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evb
      MINIO_ROOT_PASSWORD: evbsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    depends_on:
      minio-perms:
        condition: service_completed_successfully

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    environment:
      MC_HOST_local: http://evb:evbsecret@minio:9000
    command: ["mb", "--ignore-existing", "local/evb"]
    depends_on:
      minio:
        condition: service_started
    restart: on-failure

volumes:
  postgres-data:
  minio-data:
